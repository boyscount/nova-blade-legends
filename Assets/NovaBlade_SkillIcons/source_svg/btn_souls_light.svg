<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
 <style>
    .m{fill:url(#gs);stroke:#473b1e;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
    .ml{fill:none;stroke:url(#gs);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .g{fill:#fff4d0;opacity:.55}
    .d{fill:#473b1e}
    .dk{fill:#262010}
    .dl{fill:none;stroke:#473b1e;stroke-linecap:round}
    .s{fill:#fff4d0}
    .sl{fill:none;stroke:#fff4d0;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffdb86"/><stop offset=".45" stop-color="#ffd36b"/><stop offset="1" stop-color="#615029"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#fff4d0" stop-opacity=".75"/><stop offset=".6" stop-color="#fff4d0" stop-opacity=".25"/><stop offset="1" stop-color="#fff4d0" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fff3d6"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d"/>
  <feGaussianBlur in="d" stdDeviation="7" result="b"/>
  <feFlood flood-color="#ffe29f"/><feComposite in2="b" operator="in" result="g"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="sb"/><feOffset in="sb" dy="4" result="so"/>
  <feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="so" operator="in" result="sh"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <clipPath id="c"><circle cx="128" cy="128" r="127"/></clipPath>
</defs>
<g clip-path="url(#c)">
 <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
 <circle cx="128" cy="124" r="104" fill="url(#halo)"/>
 <g filter="url(#glow)"><path class="sl" style="opacity:.6" d="M60,210 L200,50" style="stroke-width:10"/><g transform="translate(128,128) rotate(40) scale(1.05)"><path class="m" d="M0,-92 L11,-76 L11,28 L-11,28 L-11,-76 Z"/><path class="dl" d="M0,-80 L0,22" style="stroke-width:3;opacity:.45"/><rect class="m" x="-32" y="26" width="64" height="12" rx="5"/><rect class="m" x="-6" y="38" width="12" height="28" rx="3"/><circle class="m" cx="0" cy="72" r="9"/></g></g>
 <circle cx="128" cy="128" r="128" fill="url(#vig)"/>
 <ellipse cx="128" cy="58" rx="96" ry="48" fill="url(#gloss)"/>
</g>
