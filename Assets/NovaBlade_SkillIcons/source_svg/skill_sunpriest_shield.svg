    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffb86d"/><stop offset=".45" stop-color="#ffa94d"/><stop offset="1" stop-color="#61401d"/>
 </linearGradient>
