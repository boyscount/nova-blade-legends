    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#62e6b1"/><stop offset=".45" stop-color="#3fe0a0"/><stop offset="1" stop-color="#18553d"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
