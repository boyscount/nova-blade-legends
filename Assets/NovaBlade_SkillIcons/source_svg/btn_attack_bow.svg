  <stop offset="0" stop-color="#a2e692"/><stop offset=".45" stop-color="#8ee07a"/><stop offset="1" stop-color="#36552e"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
