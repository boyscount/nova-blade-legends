<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
 <style>
    .m{fill:url(#gs);stroke:#1e2b47;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
