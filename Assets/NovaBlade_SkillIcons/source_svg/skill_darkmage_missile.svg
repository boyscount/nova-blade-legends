    .dl{fill:none;stroke:#361e47;stroke-linecap:round}
    .s{fill:#2a103a}
    .sl{fill:none;stroke:#2a103a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#cb86ff"/><stop offset=".45" stop-color="#c06bff"/><stop offset="1" stop-color="#492961"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#e0b5ff" stop-opacity=".75"/><stop offset=".6" stop-color="#e0b5ff" stop-opacity=".25"/><stop offset="1" stop-color="#e0b5ff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edd6ff"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
