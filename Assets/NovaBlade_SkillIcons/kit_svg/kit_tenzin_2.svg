<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
 <style>
    .m{fill:url(#gs);stroke:#163e36;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
    .ml{fill:none;stroke:url(#gs);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .g{fill:#e0fff8;opacity:.55}
    .d{fill:#163e36}
    .dk{fill:#0c211d}
    .dl{fill:none;stroke:#163e36;stroke-linecap:round}
    .s{fill:#e0fff8}
    .sl{fill:none;stroke:#e0fff8;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6fe2cb"/><stop offset=".45" stop-color="#4fdcc0"/><stop offset="1" stop-color="#1e5449"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#e0fff8" stop-opacity=".75"/><stop offset=".6" stop-color="#e0fff8" stop-opacity=".25"/><stop offset="1" stop-color="#e0fff8" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cef5ed"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d"/>
  <feGaussianBlur in="d" stdDeviation="7" result="b"/>
  <feFlood flood-color="#8de8d6"/><feComposite in2="b" operator="in" result="g"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="sb"/><feOffset in="sb" dy="4" result="so"/>
  <feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="so" operator="in" result="sh"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <clipPath id="c"><circle cx="128" cy="128" r="127"/></clipPath>
</defs>
<g clip-path="url(#c)">
 <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
 <circle cx="128" cy="124" r="104" fill="url(#halo)"/>
 <g filter="url(#glow)"><g transform="translate(128,128) rotate(0) scale(1.05)"><polygon class="m" points="0.0,-76.0 65.8,-38.0 65.8,38.0 0.0,76.0 -65.8,38.0 -65.8,-38.0"/><polygon class="dl" points="0.0,-58.0 50.2,-29.0 50.2,29.0 0.0,58.0 -50.2,29.0 -50.2,-29.0" style="stroke-width:4;opacity:.45"/><path class="d" d="M8,-46 L-24,6 L-2,6 L-10,46 L24,-8 L2,-8 Z" style="opacity:.75"/></g></g>
 <circle cx="128" cy="128" r="128" fill="url(#vig)"/>
 <ellipse cx="128" cy="58" rx="96" ry="48" fill="url(#gloss)"/>
