    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffd078"/><stop offset=".45" stop-color="#ffc65a"/><stop offset="1" stop-color="#614b22"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
