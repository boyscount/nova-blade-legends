    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#b0ecff"/><stop offset=".45" stop-color="#9fe8ff"/><stop offset="1" stop-color="#3c5861"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#3a7aff" stop-opacity=".75"/><stop offset=".6" stop-color="#3a7aff" stop-opacity=".25"/><stop offset="1" stop-color="#3a7aff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4f9ff"/></linearGradient>
