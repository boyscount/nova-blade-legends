<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
 <style>
    .m{fill:url(#gs);stroke:#272747;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
    .ml{fill:none;stroke:url(#gs);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .g{fill:#e0e0ff;opacity:.55}
    .d{fill:#272747}
    .dk{fill:#151526}
    .dl{fill:none;stroke:#272747;stroke-linecap:round}
    .s{fill:#e0e0ff}
    .sl{fill:none;stroke:#e0e0ff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a1a1ff"/><stop offset=".45" stop-color="#8c8cff"/><stop offset="1" stop-color="#353561"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#e0e0ff" stop-opacity=".75"/><stop offset=".6" stop-color="#e0e0ff" stop-opacity=".25"/><stop offset="1" stop-color="#e0e0ff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfdfff"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d"/>
  <feGaussianBlur in="d" stdDeviation="7" result="b"/>
  <feFlood flood-color="#b4b4ff"/><feComposite in2="b" operator="in" result="g"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="sb"/><feOffset in="sb" dy="4" result="so"/>
  <feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="so" operator="in" result="sh"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <clipPath id="c"><circle cx="128" cy="128" r="127"/></clipPath>
</defs>
<g clip-path="url(#c)">
 <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
 <circle cx="128" cy="124" r="104" fill="url(#halo)"/>
 <g filter="url(#glow)"><g transform="translate(160,170) rotate(0) scale(1.25)"><path class="s" d="M-10,-14 L-80,-80 L-60,-40 L-90,-50 Z" style="opacity:.85"/><circle class="m" cx="0" cy="0" r="22"/><circle class="d" cx="6" cy="6" r="5" style="opacity:.4"/></g><g transform="translate(80,108) rotate(0) scale(0.8)"><path class="s" d="M-10,-14 L-80,-80 L-60,-40 L-90,-50 Z" style="opacity:.85"/><circle class="m" cx="0" cy="0" r="22"/><circle class="d" cx="6" cy="6" r="5" style="opacity:.4"/></g><g transform="translate(184,76) rotate(0) scale(0.65)"><path class="s" d="M-10,-14 L-80,-80 L-60,-40 L-90,-50 Z" style="opacity:.85"/><circle class="m" cx="0" cy="0" r="22"/><circle class="d" cx="6" cy="6" r="5" style="opacity:.4"/></g></g>
 <circle cx="128" cy="128" r="128" fill="url(#vig)"/>
 <ellipse cx="128" cy="58" rx="96" ry="48" fill="url(#gloss)"/>
</g>
</svg>