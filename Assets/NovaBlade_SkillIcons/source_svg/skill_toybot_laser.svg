<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
 <style>
    .m{fill:url(#gs);stroke:#471010;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
    .ml{fill:none;stroke:url(#gs);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .g{fill:#ffd0d0;opacity:.55}
    .d{fill:#471010}
    .dk{fill:#260909}
    .dl{fill:none;stroke:#471010;stroke-linecap:round}
    .s{fill:#ffd0d0}
    .sl{fill:none;stroke:#ffd0d0;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ff5d5d"/><stop offset=".45" stop-color="#ff3a3a"/><stop offset="1" stop-color="#611616"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#ffd0d0" stop-opacity=".75"/><stop offset=".6" stop-color="#ffd0d0" stop-opacity=".25"/><stop offset="1" stop-color="#ffd0d0" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffc8c8"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d"/>
  <feGaussianBlur in="d" stdDeviation="7" result="b"/>
  <feFlood flood-color="#ff7f7f"/><feComposite in2="b" operator="in" result="g"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="sb"/><feOffset in="sb" dy="4" result="so"/>
  <feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="so" operator="in" result="sh"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <clipPath id="c"><circle cx="128" cy="128" r="127"/></clipPath>
</defs>
<g clip-path="url(#c)">
 <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
 <circle cx="128" cy="124" r="104" fill="url(#halo)"/>
 <g filter="url(#glow)"><path class="s" d="M104,128 L240,96 L240,160 Z" style="opacity:.55"/><path class="w" d="M112,124 L240,112 L240,144 L112,132 Z"/><g transform="translate(90,130) rotate(0) scale(0.9)"><rect class="m" x="-50" y="-40" width="100" height="84" rx="20"/><path class="ml" d="M0,-40 L0,-62" style="stroke-width:7"/><circle class="m" cx="0" cy="-66" r="9"/><rect class="d" x="-38" y="-24" width="76" height="40" rx="12" style="opacity:.8"/><circle class="s" cx="-16" cy="-4" r="9"/><circle class="s" cx="16" cy="-4" r="9"/><rect class="d" x="-20" y="26" width="40" height="7" rx="3" style="opacity:.6"/></g></g>
 <circle cx="128" cy="128" r="128" fill="url(#vig)"/>
 <ellipse cx="128" cy="58" rx="96" ry="48" fill="url(#gloss)"/>
</g>
</svg>