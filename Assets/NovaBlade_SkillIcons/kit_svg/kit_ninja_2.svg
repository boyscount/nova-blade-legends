<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
 <style>
    .m{fill:url(#gs);stroke:#321e47;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
    .ml{fill:none;stroke:url(#gs);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .g{fill:#2a1a4a;opacity:.55}
    .d{fill:#321e47}
    .dk{fill:#1b1026}
    .dl{fill:none;stroke:#321e47;stroke-linecap:round}
    .s{fill:#2a1a4a}
    .sl{fill:none;stroke:#2a1a4a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#c186ff"/><stop offset=".45" stop-color="#b36bff"/><stop offset="1" stop-color="#442961"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#d9b5ff" stop-opacity=".75"/><stop offset=".6" stop-color="#d9b5ff" stop-opacity=".25"/><stop offset="1" stop-color="#d9b5ff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ead6ff"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d"/>
  <feGaussianBlur in="d" stdDeviation="7" result="b"/>
  <feFlood flood-color="#ce9fff"/><feComposite in2="b" operator="in" result="g"/>
