  <feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="so" operator="in" result="sh"/>
  <feMerge><feMergeNode in="g"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <clipPath id="c"><circle cx="128" cy="128" r="127"/></clipPath>
</defs>
<g clip-path="url(#c)">
 <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
 <circle cx="128" cy="124" r="104" fill="url(#halo)"/>
 <g filter="url(#glow)"><g transform="translate(128,112) rotate(0) scale(1.0)"><circle class="g" cx="0" cy="-34" r="14"/><path class="g" d="M-16,-16 L16,-16 L26,30 L10,30 L4,56 L-4,56 L-10,30 L-26,30 Z"/></g><circle class="m" cx="80" cy="176" r="30"/><circle class="m" cx="128" cy="186" r="36"/><circle class="m" cx="178" cy="174" r="30"/><circle class="m" cx="104" cy="150" r="22"/><circle class="m" cx="156" cy="150" r="22"/></g>
 <circle cx="128" cy="128" r="128" fill="url(#vig)"/>
