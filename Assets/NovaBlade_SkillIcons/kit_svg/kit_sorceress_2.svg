    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#86dfff"/><stop offset=".45" stop-color="#6bd8ff"/><stop offset="1" stop-color="#295261"/>
 </linearGradient>
