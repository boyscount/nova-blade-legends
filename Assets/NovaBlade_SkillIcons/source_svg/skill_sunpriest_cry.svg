    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ff95c1"/><stop offset=".45" stop-color="#ff7eb3"/><stop offset="1" stop-color="#613044"/>
 </linearGradient>
