 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ff6d87"/><stop offset=".45" stop-color="#ff4d6d"/><stop offset="1" stop-color="#611d29"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
