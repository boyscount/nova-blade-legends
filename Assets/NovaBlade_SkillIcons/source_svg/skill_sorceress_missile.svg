    .sl{fill:none;stroke:#c8b0ff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#86adff"/><stop offset=".45" stop-color="#6b9bff"/><stop offset="1" stop-color="#293b61"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#c8b0ff" stop-opacity=".75"/><stop offset=".6" stop-color="#c8b0ff" stop-opacity=".25"/><stop offset="1" stop-color="#c8b0ff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e3ff"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
