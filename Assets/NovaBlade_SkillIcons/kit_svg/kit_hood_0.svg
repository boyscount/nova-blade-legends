    .dl{fill:none;stroke:#222247;stroke-linecap:round}
    .s{fill:#10101a}
    .sl{fill:none;stroke:#10101a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
    .w{fill:#ffffff}
    </style>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#9293ff"/><stop offset=".45" stop-color="#7a7bff"/><stop offset="1" stop-color="#2e2f61"/>
 </linearGradient>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#bcbdff" stop-opacity=".75"/><stop offset=".6" stop-color="#bcbdff" stop-opacity=".25"/><stop offset="1" stop-color="#bcbdff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dadaff"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
